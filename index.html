<input id="playerName" placeholder="Minecraft Name">
<button onclick="buyNow()">LB Karte Kaufen</button>

<script>
const API_URL = "DEINE_WEBAPP_URL_HIER";
const KEY = "MEIN_SECRET_KEY";

async function buyNow(){
  const name = document.getElementById("playerName").value.trim();
  if(!name) return alert("Bitte Minecraft-Namen eingeben!");

  try{
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ action:"order", key: KEY, player: name })
    });
    const data = await res.json();
    if(data.ok){
      alert("Bestellung angekommen ✅\nOrder-ID: " + data.id + "\nWird gleich automatisch im Server verarbeitet.");
    } else {
      alert("Fehler: " + data.error);
    }
  }catch(e){
    alert("Konnte nicht senden: " + e);
  }
}
</script>
